<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body { width: 260px; font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; padding: 16px; background: #1e2761; color: #fff; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { font-size: 12px; color: #cadcfc; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.15); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.ok { background: #7de3a8; }
  .dot.err { background: #ff9c9c; }
  a { color: #f2a63a; font-size: 12px; }
</style>
</head>
<body>
  <h1>SentryAI Agent</h1>
  <p>Shadow AI governance — MVP build</p>
  <div class="row"><span>Status</span><span id="status"><span class="dot err"></span>Checking…</span></div>
  <div class="row"><span>Mode</span><span>Ask before send</span></div>
  <div class="row"><span>Dashboard</span><span><a href="http://127.0.0.1:3000/" target="_blank">Open →</a></span></div>
  <script src="popup.js"></script>
</body>
</html>
